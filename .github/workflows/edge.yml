name: edge

# Rolling prerelease channel. On every code change to main, build the image from the Dockerfile and push it
# to GHCR as the moving `:edge` tag and an immutable `:sha-<short>` tag. The version stamped into the app
# comes from MinVer (e.g. 0.1.0-alpha.0.N), computed here because the Docker build context has no git
# history. Stable releases are handled by release-please.yml.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '**/*.csproj'
      - 'Directory.Build.props'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/edge.yml'

permissions:
  contents: read
  packages: write

# Only the newest edge run matters; cancel older in-flight runs so they don't fight over the tag.
concurrency:
  group: edge-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/voidprojectssoftware/protostar-registry

jobs:
  publish-edge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0          # MinVer needs full history to compute the prerelease version.

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        run: |
          dotnet restore src/Protostar.Registry.Api/Protostar.Registry.Api.csproj
          echo "version=$(dotnet msbuild src/Protostar.Registry.Api/Protostar.Registry.Api.csproj -t:MinVer -getProperty:MinVerVersion)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push edge image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          docker build \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE:edge" -t "$IMAGE:sha-$SHORT_SHA" .
          docker push --all-tags "$IMAGE"
