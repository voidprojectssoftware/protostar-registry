name: edge

# Rolling prerelease channel. On every code change to main, build the tip of main and push it as the
# single moving `:edge` image tag to GHCR. The version comes for free from MinVer (e.g.
# 0.1.0-alpha.0.N) and is stamped into the app; the image tag itself stays `edge`. Stable releases
# are handled separately by release-please.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '**/*.csproj'
      - 'Directory.Build.props'
      - '.github/workflows/edge.yml'

permissions:
  contents: read
  packages: write

# Only the newest edge run matters; cancel older in-flight runs so they don't fight over the tag.
concurrency:
  group: edge-image
  cancel-in-progress: true

jobs:
  publish-edge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0          # MinVer needs full history to compute the prerelease version.

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish edge container image
        run: |
          dotnet publish src/Protostar.Registry.Api/Protostar.Registry.Api.csproj \
            -c Release --os linux --arch x64 -t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository="${{ github.repository_owner }}/protostar-registry" \
            -p:ContainerImageTags=edge
