name: release-please

# Release automation. On every push to main, release-please maintains a "Release PR" that bumps the
# version (from Conventional Commits) and updates the changelog. Merging that Release PR creates the
# vX.Y.Z tag and a GitHub Release; the publish-image job then builds the image from the Dockerfile and
# pushes it to GHCR as :vX.Y.Z and :latest, with X.Y.Z stamped into the app (the version MinVer would read
# from the tag; the Docker build context has no git history, so it is passed in).
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Manifest-driven config (release-please-config.json + .release-please-manifest.json). Uses the
      # default GITHUB_TOKEN; the publish job runs in this same workflow run (gated on release_created),
      # so the "GITHUB_TOKEN does not trigger downstream workflows" limitation does not apply.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp

  publish-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push release image
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ghcr.io/voidprojectssoftware/protostar-registry
        run: |
          docker build \
            --build-arg VERSION="${TAG_NAME#v}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.version="${TAG_NAME#v}" \
            -t "$IMAGE:$TAG_NAME" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
